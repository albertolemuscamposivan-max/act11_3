<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadena de Frío Biológicos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #e0f2fe 0%, #f0f9ff 45%, #dbeafe 100%);
            background-attachment: fixed;
        }
        .card {
            background-color: rgba(255, 255, 255, 0.94);
        }
    </style>
</head>
<body class="p-4">
    <div class="container">
        <h2 class="text-primary border-bottom border-primary-subtle pb-2 fw-bold">❄️ Log de Cadena de Frío - Vacunas</h2>
        
        <div class="row mt-4 justify-content-center">
            <div class="col-md-4">
                <div class="card p-3 shadow-sm mb-3 border-0 rounded-3">
                    <label for="loteVacuna" class="form-label fw-semibold small text-muted">Código de Lote</label>
                    <input type="text" id="loteVacuna" class="form-control mb-2" placeholder="Ej. VAC-2026-01">
                    
                    <label for="tempActual" class="form-label fw-semibold small text-muted">Temperatura Actual (°C)</label>
                    <input type="number" step="0.1" id="tempActual" class="form-control mb-3" placeholder="Ej. 4.5">
                    
                    <button type="button" id="btnRegistrarTemp" class="btn btn-primary w-100 fw-semibold">
                        Registrar Lectura
                    </button>
                </div>
            </div>

            <div class="col-md-8">
                <div class="row" id="gridLecturas">
                  
                </div>
            </div>
        </div>
    </div>

  
    <script src="js/app.js"></script>
</body>
</html>
